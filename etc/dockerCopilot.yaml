Name: dockerCopilot
Host: 0.0.0.0
Port: 12712
Timeout: 120000
Log:
  Encoding: plain
ComposeDir: ${COMPOSE_DIR}
ImageDir: ${IMAGE_DIR:/data/config/image}
ImageLogosPath: ${IMAGE_LOGOS_PATH:/data/config/imageLogos.js}
AllowedOrigins:
  - http://localhost:5173
  - http://127.0.0.1:5173
Auth:
  AccessSecret: ${secretKey}
  AccessExpire: 604800